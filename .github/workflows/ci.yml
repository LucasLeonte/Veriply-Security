name: CI

# All jobs: manual trigger only.
# Gitleaks + secret-audit: also run automatically on push/PR (per security policy).
on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    # Only run on manual trigger
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Lint
        run: npm run lint -w apps/web

  lint-backend:
    runs-on: ubuntu-latest
    # Only run on manual trigger
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/apps/api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install ruff
      - name: Lint with Ruff
        run: ruff check apps/api

  test-frontend:
    runs-on: ubuntu-latest
    # Only run on manual trigger
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Test
        run: npm run test -w apps/web

  test-backend:
    runs-on: ubuntu-latest
    # Only run on manual trigger
    if: github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: veriply_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/apps/api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest httpx
      - name: Enable pgvector extension
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d veriply_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Test with pytest
        env:
          JWT_SECRET: "test-secret-key-minimum-32-characters-long-1234567890"
          POSTGRES_PASSWORD: "postgres"
          POSTGRES_USER: "postgres"
          POSTGRES_DB: "veriply_test"
          POSTGRES_HOST: "localhost"
          POSTGRES_PORT: "5432"
        run: pytest apps/api

  gitleaks:
    runs-on: ubuntu-latest
    # Runs on push, pull_request, AND manual trigger
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks scan
        uses: zricethezav/gitleaks-action@v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The action will automatically detect .gitleaks.toml in the root

  secret-audit:
    runs-on: ubuntu-latest
    # Runs on push, pull_request, AND manual trigger
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run secret validator
        # Validate .env.example (not real .env which is gitignored)
        # Uses a synthetic env with safe placeholder values so the script can parse
        run: |
          cp .env.example .env
          python scripts/manage_secrets.py validate || true
      - name: Run source code audit
        run: |
          python scripts/manage_secrets.py audit

  smoke-e2e:
    runs-on: ubuntu-latest
    # Only run on manual trigger
    if: github.event_name == 'workflow_dispatch'
    needs: [test-frontend, test-backend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Compose
        run: |
          docker --version || true
          docker compose version || true
      - name: Run smoke E2E script
        id: run-smoke
        run: |
          bash tests/e2e/smoke.sh
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: tests/e2e/smoke-logs.txt
